apiVersion: v1
kind: ConfigMap
metadata:
  name: fiap-frontend-config
  namespace: fiap-frontend
data:
  # HTTP interno no laboratorio; HTTPS termina na entrada publica (ADR-022).
  OS_UPSTREAM: "http://fiap-os-service.fiap-os.svc:8080"
  EXECUTION_UPSTREAM: "http://fiap-execution-service.fiap-execution.svc:8080"
  BILLING_UPSTREAM: "http://fiap-billing-service.fiap-billing.svc:8080"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.fiap-observability.svc:4318"
  UPSTREAM_CA_CERTIFICATE: "/etc/ssl/certs/ca-certificates.crt"
