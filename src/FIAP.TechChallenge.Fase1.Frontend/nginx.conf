# Nunca registrar query strings: o acompanhamento recebe um token privado.
log_format without_query '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log without_query;
    add_header Referrer-Policy no-referrer always;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate ${UPSTREAM_CA_CERTIFICATE};
    proxy_ssl_verify_depth 3;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/os/v1/ {
        proxy_pass ${OS_UPSTREAM}/api/os/v1/;
    }
    location /api/os/v1/ordens/acompanhamento/ {
        proxy_pass ${OS_UPSTREAM}/api/os/v1/ordens/acompanhamento/;
        access_log off;
        error_log /dev/null;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
    }
    location /api/execution/v1/ {
        proxy_pass ${EXECUTION_UPSTREAM}/api/execution/v1/;
    }
    location /api/billing/v1/ {
        proxy_pass ${BILLING_UPSTREAM}/api/billing/v1/;
    }
    location /api/ {
        return 404;
    }
    location /acompanhar-ordem/ {
        access_log off;
        error_log /dev/null;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
    }

    location /otlp/ {
        proxy_pass ${OTEL_EXPORTER_OTLP_ENDPOINT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
