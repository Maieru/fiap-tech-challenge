    environment:
      Messaging__Enabled: "true"
      Messaging__BootstrapServers: kafka:19092
      ManualExecutionAuthorizationEnabled: ${MANUAL_EXECUTION_AUTHORIZATION_ENABLED:-false}
networks:
  default:
    name: fiap-oficina
    external: true
