name: fiap-os
services:
  database:
    image: postgres:18.3
    environment:
      POSTGRES_DB: fiap_os
      POSTGRES_USER: fiap_os
      POSTGRES_PASSWORD: ${OS_DB_PASSWORD:?Preencha OS_DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - os_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U fiap_os -d fiap_os"]
      interval: 5s
      retries: 15
  api:
    build:
      context: ../../..
      dockerfile: src/Services/OrdensServico/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=database;Database=fiap_os;Username=fiap_os;Password=${OS_DB_PASSWORD:?Preencha OS_DB_PASSWORD}
      Database__ApplyMigrations: "true"
      Jwt__Issuer: ${JWT_ISSUER:?Preencha JWT_ISSUER igual ao emissor atual}
      Jwt__Audience: ${JWT_AUDIENCE:?Preencha JWT_AUDIENCE igual ao emissor atual}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Preencha JWT_SIGNING_KEY igual ao emissor atual}
      Observability__EnableOtlp: ${OS_ENABLE_OTLP:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}
    depends_on:
      database:
        condition: service_healthy
volumes:
  os_postgres_data:
