version: '3.9'

# Eu estou deixando as variaveis de ambiente aqui dentro do docker-compose para facilitar a minha vida e dos meus avaliadores. 
# Em qualquer outro projeto eu utilizaria um arquivo .env. Por favor, não fiquem bravos comigo, ok?

services:
  fiap.techchallenge.fase1.api:
    build:
      context: .
      dockerfile: FIAP.TechChallenge.Fase1.API/Dockerfile
    container_name: fiap-techchallenge-api
    depends_on:
      - db
      - otel-collector
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=fiap_tech_challenge;Username=postgres;Password=postgres

      Jwt__SigningKey: 8b301d30-2445-45e4-8d75-727c8d4001c2
      Jwt__Issuer: fiap-techchallenge
      Jwt__Audience: fiap-techchallenge-client
      Jwt__AccessTokenMinutes: 60

      OTEL_SERVICE_NAME: fiap-tech-challenge-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta

      LogLevel__Default: Information
    networks:
      - fiap-techchallenge-network

  fiap.techchallenge.fase1.frontend:
    build:
      context: ./FIAP.TechChallenge.Fase1.Frontend
      dockerfile: Dockerfile
    container_name: fiap-techchallenge-frontend
    environment:
      API_UPSTREAM: http://fiap.techchallenge.fase1.api:8080/api
      OTEL_SERVICE_NAME: fiap-tech-challenge-frontend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      - fiap.techchallenge.fase1.api
      - otel-collector
    ports:
      - "5173:80"
    networks:
      - fiap-techchallenge-network

  db:
    image: postgres:16
    container_name: fiap-techchallenge-db
    restart: always
    environment:
      POSTGRES_DB: fiap_tech_challenge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fiap-techchallenge-network

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: fiap-otel-collector
    environment:
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:?Defina NEW_RELIC_LICENSE_KEY no arquivo .env}
      NEW_RELIC_OTLP_ENDPOINT: ${NEW_RELIC_OTLP_ENDPOINT:-https://otlp.nr-data.net}
    volumes:
      - ./ObservabilityConfig/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks:
      - fiap-techchallenge-network

  # Esse daqui é opcional mas ajuda muito a vida.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fiap-techchallenge-pgadmin
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fiap-techchallenge-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fiap-techchallenge-network:
    driver: bridge
