version: '3.9'

# Eu estou deixando as variaveis de ambiente aqui dentro do docker-compose para facilitar a minha vida e dos meus avaliadores. 
# Em qualquer outro projeto eu utilizaria um arquivo .env. Por favor, não fiquem bravos comigo, ok?

services:
  fiap.techchallenge.fase1.api:
    build:
      context: .
      dockerfile: FIAP.TechChallenge.Fase1.API/Dockerfile
    container_name: fiap-techchallenge-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=fiap_tech_challenge;Username=postgres;Password=postgres

      Jwt__SigningKey: 8b301d30-2445-45e4-8d75-727c8d4001c2
      Jwt__Issuer: fiap-techchallenge
      Jwt__Audience: fiap-techchallenge-client
      Jwt__AccessTokenMinutes: 60

      OTEL_SERVICE_NAME: fiap-tech-challenge-backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    networks:
      - fiap-techchallenge-network

  fiap.techchallenge.fase1.frontend:
    build:
      context: ./FIAP.TechChallenge.Fase1.Frontend
      dockerfile: Dockerfile
    container_name: fiap-techchallenge-frontend
    environment:
      API_UPSTREAM: http://localhost:8080/api
    depends_on:
      - fiap.techchallenge.fase1.api
    ports:
      - "5173:80"
    networks:
      - fiap-techchallenge-network

  db:
    image: postgres:16
    container_name: fiap-techchallenge-db
    restart: always
    environment:
      POSTGRES_DB: fiap_tech_challenge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fiap-techchallenge-network

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: fiap-otel-collector
    volumes:
      - ./ObservabilityConfig/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - 1888:1888 
      - 8888:8888 
      - 8889:8889 
      - 13133:13133 
      - 4317:4317 
      - 4318:4318 
      - 55679:55679
    networks:
      - fiap-techchallenge-network

  jaeger:
    image: jaegertracing/jaeger:2.0.0
    container_name: fiap-jaeger
    command:
       - "--set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317"
       - "--set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
    ports:
      - "16686:16686"
    environment:
      - JAEGER_V2_MODE=all-in-one
    networks:
      - fiap-techchallenge-network
      
  prometheus:
    image: prom/prometheus
    container_name: fiap-prometheus
    volumes:
      - "./ObservabilityConfig/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - 9090:9090
    command:
      - "--enable-feature=otlp-write-receiver"
      - "--config.file=/etc/prometheus/prometheus.yml"
    networks:
      - fiap-techchallenge-network
      
  grafana:
    image: grafana/grafana:latest
    container_name: fiap-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ObservabilityConfig/grafana/provisioning:/etc/grafana/provisioning
      - ./ObservabilityConfig/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - fiap-techchallenge-network
      
  # Esse daqui é opcional mas ajuda muito a vida.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fiap-techchallenge-pgadmin
    restart: always
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - fiap-techchallenge-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  fiap-techchallenge-network:
    driver: bridge
