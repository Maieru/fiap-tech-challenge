name: Apply Infrastructure

on:
  workflow_call:
    secrets:
      INFRA_ACTION_ROLE:
        required: true
      db_username:
        required: true
      db_password:
        required: true
      jwt_signing_key:
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: bootstrap
    secrets: inherit

  aws-resources:
    name: AWS Resources
    needs: bootstrap
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: aws-resources
    secrets: inherit

  database-resources:
    name: Database Resources
    needs: aws-resources
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: database
    secrets: inherit

  kubernetes-addons:
    name: Kubernetes Add-ons
    needs: database-resources
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: kubernetes-addons
    secrets: inherit

  kubernetes-configs:
    name: Kubernetes Configs
    needs: kubernetes-addons
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: kubernetes-configs
    secrets: inherit
