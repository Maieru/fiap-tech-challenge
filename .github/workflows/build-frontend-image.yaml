name: Push Frontend

env:
  AWS_REGION: 'us-east-1'
  ECR_REPOSITORY: 'fiap-ecr-frontend-repository'
  IMAGE_TAG: ${{ github.sha }}

  DOCKERFILE_PATH: './src/FIAP.TechChallenge.Fase1.Frontend/Dockerfile' 
  DOCKER_BUILD_CONTEXT: './src/FIAP.TechChallenge.Fase1.Frontend' 

on:
  workflow_call:
    secrets:
      ACTION_ROLE_ARN:
        required: true

permissions:
  contents: read

jobs:
  build-and-push-docker:
    name: Build e Push Docker no ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.ACTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar identidade AWS
        run: aws sts get-caller-identity

      - name: Verificar se a imagem ja existe no ECR
        id: check-image
        run: |
          if aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ env.IMAGE_TAG }} \
            --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Imagem ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} ja existe no ECR."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Imagem ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} nao encontrada no ECR."
          fi

      - name: Login no Amazon ECR
        id: login-ecr
        if: steps.check-image.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        
      - name: Build da imagem Docker
        if: steps.check-image.outputs.exists != 'true'
        run: |
          docker build \
            -f ${{ env.DOCKERFILE_PATH }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }} \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest \
            ${{ env.DOCKER_BUILD_CONTEXT }}

      - name: Push da imagem Docker para o ECR
        if: steps.check-image.outputs.exists != 'true'
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
