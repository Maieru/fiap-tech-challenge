name: Monorepo CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delivery:
    name: Verify delivery tooling
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts/delivery --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix scripts/delivery
      - name: Test public gateway stabilization
        run: node --test scripts/platform/gateway-readiness.test.mjs
      - name: Test smoke checkout and zero-value saga
        run: node --test scripts/platform/smoke-flow.test.mjs
      - name: Test platform preflight and secret requirements
        run: node --test scripts/platform/resolve.test.mjs
      - name: Test database removal in central destroy
        run: node --test scripts/platform/destroy-workflow.test.mjs
      - name: Check central orchestration scripts
        run: |
          node --check scripts/platform/resolve.mjs
          node --check scripts/platform/smoke.mjs
          node --check scripts/platform/smoke-flow.mjs
          node --check scripts/platform/gateway-readiness.mjs
  frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/FIAP.TechChallenge.Fase1.Frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/FIAP.TechChallenge.Fase1.Frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run lint:ci
      - run: npm run build
      - run: docker build -t fiap-frontend:ci .
      - name: Verify unprivileged Nginx and upstream TLS
        shell: pwsh
        working-directory: .
        run: ./scripts/Test-FrontendSecurity.ps1 -Image fiap-frontend:ci
  component:
    name: Test ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: os
            solution: Backend.slnx
            assemblies: '+FIAP.TechChallenge.OS.*;-*.Tests*'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build solution
        env:
          SOLUTION: ${{ matrix.solution }}
        run: dotnet build "$SOLUTION" -c Release
      - name: Test solution with coverage
        shell: pwsh
        env:
          SOLUTION: ${{ matrix.solution }}
          COMPONENT: ${{ matrix.component }}
        run: |
          dotnet test $env:SOLUTION `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter 'TestCategory!=ContainerImage' `
            --settings coverage.runsettings `
            --collect:'XPlat Code Coverage;Format=cobertura,opencover' `
            --logger trx `
            --results-directory "artifacts/test-results/$env:COMPONENT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./.github/actions/coverage
        with:
          reports: artifacts/test-results/${{ matrix.component }}/**/coverage.cobertura.xml
          assemblies: ${{ matrix.assemblies }}
          output: artifacts/coverage/${{ matrix.component }}
      - name: Build OS image
        if: matrix.component == 'os'
        run: docker build -f Dockerfile -t fiap-os:ci .
      - name: Test OS image through NUnit and Testcontainers
        if: matrix.component == 'os'
        shell: pwsh
        env:
          OS_TEST_IMAGE: fiap-os:ci
          OS_OPENAPI_OUTPUT: ${{ github.workspace }}/artifacts/os-openapi.json
        run: |
          dotnet test src/FIAP.TechChallenge.OS.Integration.Tests/FIAP.TechChallenge.OS.Integration.Tests.csproj `
            --configuration Release --no-build --no-restore --filter 'TestCategory=ContainerImage' `
            --logger trx --results-directory artifacts/image-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ matrix.component }}
          path: |
            artifacts/test-results/
            artifacts/coverage/
            artifacts/image-tests/
            artifacts/os-openapi.json

  quality:
    name: SonarQube
    needs: component
    uses: ./.github/workflows/sonarqube.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-required:
    name: ci-required
    if: always()
    needs: [frontend, component, quality, delivery]
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend, tests, coverage and quality success
        env:
          TEST_RESULT: ${{ needs.component.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DELIVERY_RESULT: ${{ needs.delivery.result }}
        run: test "$FRONTEND_RESULT" = success && test "$TEST_RESULT" = success && test "$QUALITY_RESULT" = success && test "$DELIVERY_RESULT" = success
