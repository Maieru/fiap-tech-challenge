name: Deploy Backend

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_FILE: './src/TechChallengeFase1.slnx'

on:
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verificar arquivos não UTF-8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
      
          extensions = {'.cs', '.csproj', '.sln', '.slnx', '.json', '.yml', '.yaml', '.md'}
          invalid_files = []
      
          for path in Path('.').rglob('*'):
              if not path.is_file():
                  continue
      
              if path.suffix.lower() not in extensions:
                  continue
      
              try:
                  path.read_text(encoding='utf-8')
              except UnicodeDecodeError as ex:
                  invalid_files.append((path, ex))
      
          if invalid_files:
              print("Arquivos que NÃO estão em UTF-8:")
              for path, ex in invalid_files:
                  print(f"- {path}: {ex}")
              raise SystemExit(1)
      
          print("Todos os arquivos verificados estão em UTF-8.")
          PY
          
      - name: Restaurar dependências
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build da solução
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --verbosity normal
          
      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACTION_ROLE_ARN }}
          aws-region: us-east-1
