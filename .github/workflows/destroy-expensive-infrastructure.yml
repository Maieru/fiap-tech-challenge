name: 2. Destroy Expensive AWS Infrastructure

on:
  schedule:
    # GitHub Actions usa UTC: 03:00 UTC corresponde a 00:00 em São Paulo.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

jobs:
  check_eks:
    name: Check EKS
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.eks.outputs.exists }}
    steps:
      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.INFRA_ACTION_ROLE }}

      - name: Verificar existência do EKS
        id: eks
        shell: bash
        run: |
          exists=$(aws eks list-clusters \
            --query "contains(clusters, 'fiap-eks-cluster')" \
            --output text)
          echo "exists=${exists,,}" >> "$GITHUB_OUTPUT"

  destroy_kubernetes_configs:
    name: Destroy Kubernetes Configs
    needs: check_eks
    if: needs.check_eks.outputs.exists == 'true'
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: kubernetes-configs
      operation: destroy
      require_approval: false
    secrets: inherit

  destroy_kubernetes_addons:
    name: Destroy Kubernetes Add-ons
    needs:
      - check_eks
      - destroy_kubernetes_configs
    if: ${{ always() && needs.check_eks.result == 'success' && needs.check_eks.outputs.exists == 'true' && needs.destroy_kubernetes_configs.result == 'success' }}
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: kubernetes-addons
      operation: destroy
      require_approval: false
    secrets: inherit

  disable_expensive_aws_resources:
    name: Disable EKS and RDS
    needs:
      - check_eks
      - destroy_kubernetes_addons
    if: ${{ always() && needs.check_eks.result == 'success' && ((needs.check_eks.outputs.exists == 'true' && needs.destroy_kubernetes_addons.result == 'success') || (needs.check_eks.outputs.exists == 'false' && needs.destroy_kubernetes_addons.result == 'skipped')) }}
    uses: ./.github/workflows/terraform-stage.yml
    with:
      stage: aws-resources
      operation: apply
      create_eks_instance: false
      create_rds_instance: false
      require_approval: false
    secrets: inherit
