name: Deploy and migrate service
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      role_arn:
        type: string
        required: true
      component:
        type: string
        default: os
      image_digest:
        type: string
        required: true
      kafka_bootstrap_servers:
        type: string
        required: true
      jwt_issuer:
        type: string
        required: true
      jwt_audience:
        type: string
        required: true
    secrets:
      REPOSITORIES_TOKEN:
        required: false
    outputs: {}
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    if: github.repository == 'Maieru/fiap-tech-challenge' && github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-east-1
      COMPONENT: ${{ inputs.component }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      GH_TOKEN: ${{ secrets.REPOSITORIES_TOKEN || github.token }}
      EKS_CLUSTER_NAME: fiap-eks-cluster
      IMAGE_DIGEST: ${{ inputs.image_digest }}
      KAFKA_BOOTSTRAP_SERVERS: ${{ inputs.kafka_bootstrap_servers }}
      JWT_ISSUER: ${{ inputs.jwt_issuer }}
      JWT_AUDIENCE: ${{ inputs.jwt_audience }}
      DELIVERY_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Maieru/fiap-tech-challenge
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.REPOSITORIES_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --prefix scripts/delivery --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix scripts/delivery
      - name: Exigir CI do SHA e repositorio selecionados
        run: node scripts/delivery/delivery.mjs verify-ci
      - name: Autenticar AWS via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: us-east-1
      - name: Sincronizar segredos, migrar e acompanhar rollout
        id: image
        run: node scripts/delivery/delivery.mjs deploy
