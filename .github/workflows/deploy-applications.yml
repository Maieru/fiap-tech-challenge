name: Deploy Applications

on:
  workflow_call:
    secrets:
      INFRA_ACTION_ROLE:
        required: true

env:
  AWS_REGION: 'us-east-1'
  EKS_CLUSTER_NAME: 'fiap-eks-cluster'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.INFRA_ACTION_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar acesso ao EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verificar acesso ao cluster
        run: kubectl auth can-i '*' '*' --all-namespaces

      - name: Atualizar External Secrets
        run: |
          kubectl rollout restart deployment/external-secrets -n external-secrets
          kubectl rollout status deployment/external-secrets -n external-secrets --timeout=2m

      - name: Aplicar manifests
        run: |
          kubectl apply -f k8s/backend
          kubectl apply -f k8s/frontend

      - name: Reiniciar aplicações
        run: |
          kubectl rollout restart deployment/fiap-backend-deployment -n fiap-backend
          kubectl rollout restart deployment/fiap-frontend-deployment -n fiap-frontend

      - name: Aguardar deploy
        run: |
          kubectl rollout status deployment/fiap-backend-deployment -n fiap-backend --timeout=5m
          kubectl rollout status deployment/fiap-frontend-deployment -n fiap-frontend --timeout=5m

      - name: Aguardar ALB interno
        shell: bash
        run: |
          for attempt in {1..60}; do
            alb_hostname=$(kubectl get ingress fiap-backend-ingress \
              -n fiap-backend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [[ -n "$alb_hostname" ]]; then
              echo "ALB interno disponível: $alb_hostname"
              exit 0
            fi

            echo "Aguardando o AWS Load Balancer Controller provisionar o ALB ($attempt/60)..."
            sleep 10
          done

          echo "O ALB interno não ficou disponível dentro do tempo esperado."
          kubectl describe ingress fiap-backend-ingress -n fiap-backend
          kubectl logs deployment/aws-load-balancer-controller -n kube-system --tail=100
          exit 1
